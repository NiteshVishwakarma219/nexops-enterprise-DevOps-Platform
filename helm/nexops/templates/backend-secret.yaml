{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secret.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "backend.secret.DATABASE_URL is required" .Values.backend.secret.DATABASE_URL | quote }}
  DIRECT_URL: {{ required "backend.secret.DIRECT_URL is required" .Values.backend.secret.DIRECT_URL | quote }}
  JWT_SECRET: {{ required "backend.secret.JWT_SECRET is required" .Values.backend.secret.JWT_SECRET | quote }}
  ADMIN_KEY: {{ required "backend.secret.ADMIN_KEY is required" .Values.backend.secret.ADMIN_KEY | quote }}
  ALLOWED_ORIGIN: {{ .Values.backend.secret.ALLOWED_ORIGIN | quote }}
  FRONTEND_URL: {{ .Values.backend.secret.FRONTEND_URL | quote }}
  EMAIL_USER: {{ .Values.backend.secret.EMAIL_USER | quote }}
  EMAIL_PASS: {{ .Values.backend.secret.EMAIL_PASS | quote }}
  NOTIFY_EMAIL: {{ .Values.backend.secret.NOTIFY_EMAIL | quote }}
  RESEND_API_KEY: {{ .Values.backend.secret.RESEND_API_KEY | quote }}
{{- end }}
