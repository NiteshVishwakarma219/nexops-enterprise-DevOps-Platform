apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexops-backend
  namespace: nexops
  labels:
    app: nexops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexops-backend
  template:
    metadata:
      labels:
        app: nexops-backend
    spec:
      containers:
        - name: backend
          image: cloudwithnitesh/nexops-backend:1.0.0   
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: nexops-app-config
            - secretRef:
                name: nexops-backend-secret
          volumeMounts:
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: nexops-uploads
