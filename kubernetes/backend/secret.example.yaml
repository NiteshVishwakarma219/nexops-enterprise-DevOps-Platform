# Copy this file to kubernetes/backend/secret.yaml and replace every value.
# NEVER COMMIT secret.yaml. It is intentionally ignored by .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: nexops-backend-secret
  namespace: nexops
type: Opaque
stringData:
  DATABASE_URL: "postgresql://..."
  DIRECT_URL: "postgresql://..."
  JWT_SECRET: "replace-me"
  ADMIN_KEY: "replace-me"
  ALLOWED_ORIGIN: "http://nexops.local"
  FRONTEND_URL: "http://nexops.local"
  EMAIL_USER: ""
  EMAIL_PASS: ""
  NOTIFY_EMAIL: ""
  RESEND_API_KEY: ""
