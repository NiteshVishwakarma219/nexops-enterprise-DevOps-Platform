apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexops-ingress
  namespace: nexops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: nitesh.shop
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexops-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexops-frontend
                port:
                  number: 80
