services:

  # ── Backend ─────────────────────────────────────────────────
  # Pulls the pre-built image from Docker Hub — no source code needed.
  backend:
    image: cloudwithnitesh/nexops-backend:v1.0
    container_name: nexops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - nexops-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend ─────────────────────────────────────────────────
  # Port 3000 avoids clash with Jenkins which uses 8080 by default.
  frontend:
    image: cloudwithnitesh/nexops-frontend:v1.1
    container_name: nexops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexops-net

networks:
  nexops-net:
    driver: bridge
